};
var goods = Object.assign({}, all_goods);

function filter(filtername) {
	for (var key in goods) {
		console.log($("#" + filtername).val() + " " + goods[key][filtername]);
		if ($("#" + filtername).val() != '-') {
			if ($("#" + filtername).val() != goods[key][filtername]) delete goods[key];
		}
	}
}
function show() {
	var out = ' ';
	for (var key in goods) {
		out+='<div class="elem">Название: ' + goods[key].name + '<br>';
		out+='Где растет: '+goods[key].grows + '<br>';
		out+='Цена: '+goods[key].cost + '<br>';
		out+='Наличие: '+goods[key].sklad + '<br>';
		//out+='<img src=" '+goods[key].img + ' ">';
		out+='<hr></div>';
	}
	$("#out").html(out);
}
function reset() {
	goods = Object.assign({}, all_goods);
	$(".filter").val('-');
	show();
	return false;
}
function filters() {
	goods = Object.assign({}, all_goods);
	filter('grows');
	filter('cost');
	filter('sklad');
	show();
}
$(function(){
	show();
	$(".reset").on('click', reset);
});

	<body>
		<form>
			<select class="filter" id="grows" onchange="filters();">
				<option value="-">-</option>
				<option value="На дереве">На дереве</option>
				<option value="На кусте">На кусте</option>

			</select>
			<select class="filter" id="cost" onchange="filters();">
				<option value="-">-</option>
				<option value="30">30</option>
				<option value="40">40</option>
			</select>
			<select class="filter" id="sklad" onchange="filters();">
				<option value="-">-</option>
				<option value="да">да</option>
				<option value="нет">нет</option>
			</select>
			<button class="reset">Сброс</button>
		</form>

	</body>
