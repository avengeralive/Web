<div ng-controller="promotionsController2 as plCntr" class="container" style="padding-top: 50px; padding-bottom: 50px;">
	<div class="row">
		<div class="col-12 col-sm-12 col-md-12 row">
			<div class="col col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12" style="padding:0px; margin-bottom: 25px;">
				<form ng-submit="getResult();">
					<div class="col col-12 col-sm-12 col-md-8 col-lg-8 col-xl-8 checkfield row" style="padding: 0px;">
						<div class="col col-8 col-sm-8 col-md-8 col-lg-8 col-xl-8 form-group" style="padding-left: 0px;">
							<input type="text" class="form-control" ng-model="search" placeholder="Поиск по ключевым словам">
						</div>
						<div class="col col-4 col-sm-4 col-md-4 col-lg-4 col-xl-4" style="padding-right: 0px;">
							<button class="mui-btn mui-btn--primary" id="searchbutton"><i class="fa fa-search"></i></button>
						</div>
					</div>
				</form>
			</div>
			<div class="col col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 row" style="padding: 0px; padding-bottom: 15px; text-align: right;">
				<form ng-submit="page = 0; places = []; getResultByLocation();">
					<div class="checkfield">
					    <input type="text" id="map_addr" class="form-control" ng-model="addr" placeholder="Поиск по месту" style="width: 300px; float: left; margin-top: 0px;">
					    <select ng-model="radius" style="float: left; height: 44px; border-radius: 0px !important; margin-top: 0px;">
					    	<option value="50">В радиусе 50 метров</option>
					    	<option value="100">В радиусе 100 метров</option>
					    	<option value="250">В радиусе 250 метров</option>
					    	<option value="500">В радиусе 500 метров</option>
					    	<option value="1000">В радиусе 1 км</option>
					    </select>
						<button class="mui-btn mui-btn--primary search_btn" id="searchbutton2"><i class="fa fa-search"></i></button>
					</div>
				</form>
			</div>
			<div class="col col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12" style="padding:0px; margin-bottom: 25px;">
			    <nav class="nav nav-pills flex-column flex-sm-row col-12 dned" style="margin-bottom: 20px;">
			    <a ng-click="availability[0] = true; getResult()" class="nav-link" onclick="$('.nav-link').removeClass('active'); $(this).addClass('active');">Понедельник</a> <a ng-click="availability[1] = true; getResult()" class="nav-link" onclick="$('.nav-link').removeClass('active'); $(this).addClass('active');">Вторник</a> <a ng-click="availability[2] = true; getResult()" class="nav-link" onclick="$('.nav-link').removeClass('active'); $(this).addClass('active');">Среда</a> <a ng-click="availability[3] = true; getResult()" class="nav-link" onclick="$('.nav-link').removeClass('active'); $(this).addClass('active');">Четверг</a> <a ng-click="availability[4] = true; getResult()" class="nav-link" onclick="$('.nav-link').removeClass('active'); $(this).addClass('active');">Пятница</a> <a ng-click="availability[5] = true; getResult()" class="nav-link" onclick="$('.nav-link').removeClass('active'); $(this).addClass('active');">Суббота</a> <a ng-click="availability[6] = true; getResult()" class="nav-link" onclick="$('.nav-link').removeClass('active'); $(this).addClass('active');">Воскресенье</a>
			    </nav>
			</div>
			<div class="col col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 row items" style="padding: 0px; padding-top: 15px;" ng-show="tab == 1"></div>
				<div class="col-12 col-sm-6 col-md-4" ng-repeat="promotion in promotions" style='display:flex;'>
					<div class="card" style="width: 100%; margin-bottom: 30px;">
						<img src="/uploads/{{ promotion.cover_image }}" class="card-img-top">
						<div class="card-body text-center">
							<h4 class="card-title">{{ promotion.title }}</h4>
							<p style="text-align:center; font-style: italic;">от заведения "<a href="/{{ promotion.slug }}">{{ promotion.place_name }}</a>"</p>
							<p style="text-align:left;">{{ promotion.content.substring(0, 80) }}...</p>
							<a href="/promotions/{{ promotion.id }}" class="mui-btn mui-btn--primary">Подробнее</a>
						</div>
					</div>
				</div>
			</div>
			<div class="col col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 row items" style="padding: 0px; padding-top: 15px; height:500px;" ng-show="tab == 3">
				<div id="map"></div>
				<style>
					#map {
						height: 100%;
						display: block;
					}
				</style>
			</div>
			<div class="col col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12" style="padding:0px; margin-bottom: 25px;">
				<a ng-click="more();" class="mui-btn mui-btn--primary" style="width:33%; margin-left: 33%;">Ещё акции</a>
			</div>
		</div>
	</div>
</div>
