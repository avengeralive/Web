	<body>
		<div class="modal fade" id="login" tabindex="-1" role="dialog" aria-labelledby="loginLabel" aria-hidden="true">		
			<div class="modal-dialog" role="document">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="loginLabel">Авторизация</i></h5>
						<button type="button" class="close" data-dismiss="modal" aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
					</div>							
					<div class="modal-body">
						<div class="container-fluid">
							<div class="row">
								<div class="col col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 row">
									<form ng-submit="login()">
										<div class="row">
											<div class="col col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12" id="login_error"></div>
											<div class="col col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 mui-textfield mui-textfield--float-label">
												<input type="text" ng-model="user_login">
												<label>Введите Ваш e-mail</label>
											</div>
											<div class="col col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 mui-textfield mui-textfield--float-label">
												<input type="password" ng-model="user_pass">
												<label>Введите Ваш пароль</label>
											</div>
											<div class="col col-12 col-sm-6 col-md-6 col-lg-6 col-xl-6">
												<button type="submit" class="mui-btn mui-btn--primary act">Войти</button>
											</div>
										</div>
									</form>
								</div>
							</div>
						</div>
					</div>	
				</div>
			</div>					
		</div>
		<div class="modal fade" id="register" tabindex="-1" role="dialog" aria-labelledby="loginLabel" aria-hidden="true">		
			<div class="modal-dialog" role="document">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="loginLabel">Регистрация</i></h5>
						<button type="button" class="close" data-dismiss="modal" aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
					</div>							
					<div class="modal-body">
						<div class="container-fluid">
							<div class="row">
								<div class="col col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 row">
									<form ng-submit="registration()" id="regForm">
										<div class="row">
											<div class="col-12">
												<p>Зарегистрироваться как</p>
												<label class="custom-control custom-radio">
													<input ng-model="register.group_name" type="radio" class="custom-control-input" value="client" ng-checked="true">
													<span class="custom-control-indicator"></span>
													<span class="custom-control-description">Пользователь</span>
												</label>
												<label class="custom-control custom-radio">
													<input ng-model="register.group_name" type="radio" class="custom-control-input" value="company">
													<span class="custom-control-indicator"></span>
													<span class="custom-control-description">Заведение</span>
												</label>
											</div>
											<div class="col col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 mui-textfield mui-textfield--float-label">
												<input type="text" ng-model="register.user_login">
												<label>Введите Ваш e-mail</label>
											</div>
											<div class="col-12 mui-checkbox">
												<label for="agree"><input type="checkbox" ng-model="register.agree" value="1"> Я даю согласие на обработку персональных данных и принимаю условия пользовательского соглашения</label>
											</div>
											<div class="col col-12 col-sm-6 col-md-6 col-lg-6 col-xl-6">
												<button type="submit" class="mui-btn mui-btn--primary act">Регистрация</button>
											</div>
										</div>
									</form>
									<p class="text-success" style="display:none;" id="registerSuccess">На указанную почту отправлен пароль. Используйте его для входа в систему.</p>
								</div>
							</div>
						</div>
					</div>	
				</div>
			</div>					
		</div>
		<header>
			<div class="container">
				<nav class="navbar navbar-expand-lg navbar-light" style="justify-content: left;">
					<!--<a class="navbar-brand" href="/"><img src="/assets/images/logo.png" style="height:40px;"></a>-->
					<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation" style="width: 50px; margin-right: 30px;">
						<span class="navbar-toggler-icon"></span>
					</button>
					<a class="navbar-brand" href="/"><img src="/assets/images/logo.png" style="height:47px;margin-top: 8px;"></a>
					<div class="collapse navbar-collapse" id="navbarSupportedContent">
						<ul class="navbar-nav mr-auto">
							<li class="nav-item">
								<a class="nav-link" href="/places">Заведения</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="/promotions">Акции</a>
							</li>
						</ul>
						<ul class="navbar-nav ml-auto">
							<li class="nav-item" ng-show="authorized == true">
								<a class="nav-link" href="/dashboard">Личный кабинет <span ng-show="notifications > 0" class="badge badge-pill badge-danger">{{ notifications }}</span></a>
							</li>
							<li class="nav-item" ng-show="authorized == true">
								<a class="nav-link" ng-click="logout()">Выход</a>
							</li>
							<li class="nav-item" ng-show="authorized == false">
								<a class="nav-link" data-toggle="modal" data-target="#login">Вход</a>
							</li>
							<li class="nav-item" ng-show="authorized == false">
								<a class="nav-link" data-toggle="modal" data-target="#register">Регистрация</a>
							</li>
							
						</ul>
					</div>
				</nav>
			</div>
		</header>
		<section ng-view autoscroll="true"></section>

			<div class="container">
