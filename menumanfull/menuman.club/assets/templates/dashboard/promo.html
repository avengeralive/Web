<div class="container content" ng-controller="promocodesController as prmCntr" ng-show="group === 'admin' || group === 'company'">
	<div class="row">
		<div class="col col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
			<h2>Проверить промокод</h2>
			<form ng-submit="checkPromo();">
				<div class="row">
					<div class="col col-12 col-sm-8 col-md-8 col-lg-8 col-xl-8 mui-textfield mui-textfield--float-label">
						<input type="text" ng-model="promo.code">
						<label>Введите промокод</label>
					</div>
					<div class="col col-12 col-sm-4 col-md-4 col-lg-4 col-xl-4">
						<button class="mui-btn mui-btn--primary"><span class="fa fa-check"></span> Проверить</button>
					</div>
				</div>
			</form>
		</div>
		<div class="col col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
			<h2>Проверенные промокоды</h2>
			<div class="row">
				<p ng-repeat="ppromo in ppromos track by $index">#{{ ppromo.id }} {{ ppromo.first_name }} {{ ppromo.last_name}} - {{ ppromo.code }} - {{ ppromo.used_date }}</p>
			</div>
		</div>	
	</div>
</div>
