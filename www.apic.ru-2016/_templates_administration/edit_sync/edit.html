<script>
function ifill(id){
va = document.getElementById(	'groupyandexmarketprice_'+id	).value;
dd = getElementsByClassNameWrapperArray('price_'+id);
for (var i = 0; i<dd.length; i++) {
	dd[i].value=va;
	dd[i].parentNode.className ="imchanged";
	};
return false;
}

function icheck(id,type){
dd = getElementsByClassNameWrapperArray('yandexmarket_'+id+'_'+type);
for (var i = 0; i<dd.length; i++) {
	dd[i].checked=true;
	dd[i].parentNode.className ="imchanged";
	};
return false;
}

function getElementsByClassNameWrapperArray(name){
		if(document.getElementsByClassName) {
			 return toArray(document.getElementsByClassName(name));
			 }
		else {
			return toArray(getElementsByClassPure(name));
			};	
	}

//    http://ejohn.org/blog/getelementsbyclassname-speed-comparison/ 
function getElementsByClassPure(searchClass,node,tag) {
  var classElements = new Array();
  if ( node == null )
    node = document;
  if ( tag == null )
    tag = '*';
  var els = node.getElementsByTagName(tag);
  var elsLen = els.length;
  var pattern = new RegExp("(^|\\s)"+searchClass+"(\\s|$)");
  for (i = 0, j = 0; i < elsLen; i++) {
    if ( pattern.test(els[i].className) ) {
      classElements[j] = els[i];
      j++;
    }
  }
  return classElements;
}
function toArray(elems) {
	var arr = new Array;
	for (var i = 0; elems[i]; i++) {
		arr.push(elems[i]);
	}
	return arr;
}
</script>
